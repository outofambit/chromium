<!DOCTYPE html>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<script src="/bluetooth/resources/bluetooth-test.js"></script>
<script src="/bluetooth/resources/bluetooth-fake-devices.js"></script>
<script>
  'use strict';
  bluetooth_test(async () => {
    let fake_central =
      await navigator.bluetooth.test.simulateCentral({ state: 'powered-on' });
    let fake_chooser = await navigator.bluetooth.test.getManualChooser();

    await setBluetoothFakeAdapter('DeviceEventAdapter');
    let requestDevicePromise = requestDeviceWithTrustedClick({
      filters: [{ services: ['heart_rate'] }]
    });

    let events = await fake_chooser.waitForEvents(4);

    assert_equals(events[0].type, 'chooser-opened');
    assert_equals(events[1].type, 'add-or-update-device');
    assert_equals(Object.hasOwn(events[1], 'peripheralAddress'), true);
    assert_equals(events[2].type, 'discovering');
    assert_equals(events[3].type, 'discovery-idle');

    let fake_peripheral = new FakePeripheral(events[1].peripheralAddress, fake_central.fake_central_ptr_)
    await fake_chooser.selectPeripheral(fake_peripheral);
    return requestDevicePromise;
  });
</script>
